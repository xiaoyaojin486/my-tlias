#配置数据库连接信息
spring:
  # 导入 .env 文件中的敏感配置(数据库密码等), 模板见仓库根目录 .env.example
  # .env 已被 .gitignore 忽略; 文件不存在时会被安全跳过, 不影响启动
  # 同时尝试模块目录和仓库根目录, 兼容两种启动时的工作目录
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tlias}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB #单个文件最大大小限制10MB
      max-request-size: 100MB #单个请求最大大小限制100MB

#JWT配置
tlias:
  jwt:
    #签名密钥(Base64编码), 从 .env 读取, 模板见仓库根目录 .env.example
    #要求解码后 >= 256 bit(32字节), 否则应用启动时会直接失败
    sign-key: ${JWT_SIGN_KEY}
    expire: ${JWT_EXPIRE:43200000} #令牌有效期(毫秒), 默认12小时

#配置mybatis的日志输出到控制台
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #配置mybatis的驼峰命名的映射开关
    map-underscore-to-camel-case: true
#查看事务管理的日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#阿里云oss配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: hu-tlias


